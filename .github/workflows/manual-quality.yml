name: Manual report quality

on:
  pull_request:
    paths:
      - "manual-reports/**"
      - "scripts/validate-manual-report.mjs"
      - "scripts/test-manual-report-validation.mjs"
      - "scripts/report-quality-metrics.mjs"
      - "scripts/check-bundle-budget.mjs"
      - "scripts/manage-production-qa-user.mjs"
      - "scripts/run-production-authenticated-qa.mjs"
      - "scripts/production-authenticated-qa.playwright.js"
      - "scripts/audit-hourly-policy-collection.mjs"
      - "scripts/lib/hourly-policy-operations.mjs"
      - "scripts/test-hourly-policy-operations.mjs"
      - "src/App.tsx"
      - "src/lib/reportMappers.ts"
      - "supabase/functions/analyze/index.ts"
      - "vite.config.ts"
      - "docs/manual-analysis/report-governance-registry-v1.0.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - ".github/CODEOWNERS"
      - "scripts/**"
      - "supabase/functions/**"
      - "docs/operations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies and tracked secrets
        run: |
          npm run security:audit
          npm run security:secret-scan

      - name: Check production QA tooling syntax
        run: |
          node --check scripts/manage-production-qa-user.mjs
          node --check scripts/run-production-authenticated-qa.mjs
          node --check scripts/production-authenticated-qa.playwright.js
          node --check scripts/lib/policy-attachments.mjs
          node --check scripts/test-policy-attachments.mjs
          node --check scripts/configure-production.mjs
          node --check scripts/create-zero-cost-production-backup.mjs
          node --check scripts/verify-zero-cost-production-backup.mjs
          node --check scripts/audit-production-write-readiness.mjs
          node --check scripts/plan-manual-inbox-migration.mjs
          node --check scripts/build-production-operations-summary.mjs
          node --check scripts/evaluate-hourly-recovery.mjs

      - name: Check policy operations contracts
        run: npm run policy:operations-test

      - name: Test policy attachment extraction
        run: npm run policy:attachment-test

      - name: Check workflow and production write guards
        run: |
          npm run security:workflow-test
          npm run setup:production-test
          npm run backup:test

      - name: Validate all manual reports
        env:
          MANUAL_QUALITY_STRICT: "true"
        run: npm run manual:validate -- manual-reports/*.json

      - name: Run validation regression suite
        run: npm run manual:test

      - name: Check governance registry and metrics
        run: npm run manual:metrics

      - name: Build frontend
        run: npm run build

      - name: Check bundle budgets
        run: npm run build:budget
