name: Crawl policy sources

on:
  schedule:
    # Asia/Shanghai workdays, every hour from Monday 00:00 to Friday 23:00.
    - cron: "0 16-23 * * 0-4"
    - cron: "0 0-15 * * 1-5"
    # Asia/Shanghai weekends, every 12 hours at Saturday/Sunday 00:00 and 12:00.
    - cron: "0 16 * * 5,6"
    - cron: "0 4 * * 6,0"
  workflow_dispatch:
    inputs:
      source:
        description: "Source keys, comma-separated, or all"
        required: false
        default: "all"
      limit:
        description: "Maximum policy candidates to ingest"
        required: false
        default: "80"

permissions:
  contents: read

concurrency:
  group: policy-source-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl and ingest policy documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
          CRAWL_SOURCE: ${{ github.event.inputs.source || 'all' }}
          CRAWL_LIMIT: ${{ github.event.inputs.limit || '80' }}
        run: |
          node scripts/crawl-policy-sources.mjs \
            --source="${CRAWL_SOURCE}" \
            --limit="${CRAWL_LIMIT}" \
            --out=artifacts/policy-candidates.json \
            --auto-publish

      - name: Upload crawl artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-candidates
          path: artifacts/policy-candidates.json
          if-no-files-found: ignore
