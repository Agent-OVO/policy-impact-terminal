name: Crawl policy sources

on:
  schedule:
    # Asia/Shanghai workdays, every hour from Monday 00:00 to Friday 23:00.
    - cron: "0 16-23 * * 0-4"
    - cron: "0 0-15 * * 1-5"
    # Asia/Shanghai weekends, every 12 hours at Saturday/Sunday 00:00 and 12:00.
    - cron: "0 16 * * 5,6"
    - cron: "0 4 * * 6,0"
  workflow_dispatch:
    inputs:
      source:
        description: "Source keys, comma-separated, or all"
        required: false
        default: "all"
      limit:
        description: "Maximum policy candidates to ingest"
        required: false
        default: "80"
      since:
        description: "Only ingest policies published on or after this date"
        required: false
        default: "2026-05-01"

permissions:
  contents: read

concurrency:
  group: policy-source-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase crawl configuration
        id: config
        env:
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_FUNCTION_JWT" ] && [ -n "$SUPABASE_CRAWLER_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase crawl secrets are not fully configured; skipping scheduled ingest."
          fi

      - name: Crawl and ingest policy documents
        if: steps.config.outputs.ready == 'true'
        env:
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
          CRAWL_SOURCE: ${{ github.event.inputs.source || 'all' }}
          CRAWL_LIMIT: ${{ github.event.inputs.limit || '80' }}
          CRAWL_SINCE: ${{ github.event.inputs.since || '2026-05-01' }}
        run: |
          node scripts/crawl-policy-sources.mjs --preflight
          node scripts/crawl-policy-sources.mjs \
            --source="${CRAWL_SOURCE}" \
            --limit="${CRAWL_LIMIT}" \
            --since="${CRAWL_SINCE}" \
            --exclude-undated \
            --out=artifacts/policy-candidates.json \
            --ingest

      - name: Upload crawl artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-candidates
          path: artifacts/policy-candidates.json
          if-no-files-found: ignore
