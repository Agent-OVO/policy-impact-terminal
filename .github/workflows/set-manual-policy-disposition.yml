name: Set manual policy disposition

on:
  workflow_dispatch:
    inputs:
      policy_id:
        description: "Policy UUID to update"
        required: true
      disposition:
        description: "Manual review action"
        required: true
        type: choice
        default: "wait"
        options:
          - pending
          - wait
          - archive
          - dismiss
      reason:
        description: "Required for wait, archive, dismiss, and stale-job closure"
        required: false
        default: ""
      close_open_job:
        description: "Explicitly fail all open analysis jobs for this policy before changing disposition"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: manual-policy-disposition-${{ github.event.inputs.policy_id }}
  cancel-in-progress: false

jobs:
  set-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate disposition request
        env:
          DISPOSITION: ${{ github.event.inputs.disposition }}
          REASON: ${{ github.event.inputs.reason }}
          CLOSE_OPEN_JOB: ${{ github.event.inputs.close_open_job }}
        run: |
          case "$DISPOSITION" in
            pending|wait|archive|dismiss) ;;
            *)
              echo "::error::Unsupported disposition: $DISPOSITION"
              exit 1
              ;;
          esac

          if [ "$DISPOSITION" != "pending" ] && [ "${#REASON}" -lt 4 ]; then
            echo "::error::$DISPOSITION requires a reason of at least 4 characters"
            exit 1
          fi
          if [ "$CLOSE_OPEN_JOB" = "true" ] && [ "${#REASON}" -lt 4 ]; then
            echo "::error::close_open_job requires a reason of at least 4 characters"
            exit 1
          fi

      - name: Apply manual review disposition
        env:
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
          POLICY_ID: ${{ github.event.inputs.policy_id }}
          DISPOSITION: ${{ github.event.inputs.disposition }}
          REASON: ${{ github.event.inputs.reason }}
          CLOSE_OPEN_JOB: ${{ github.event.inputs.close_open_job }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/manual-analysis
          args=("$DISPOSITION" "--policyId=$POLICY_ID")
          if [ -n "$REASON" ]; then
            args+=("--reason=$REASON")
          fi
          if [ "$CLOSE_OPEN_JOB" = "true" ]; then
            args+=("--closeOpenJob=true")
          fi
          node scripts/manual-policy-analysis.mjs "${args[@]}" \
            | tee "artifacts/manual-analysis/disposition-$POLICY_ID.json"

      - name: Upload disposition result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manual-policy-disposition-${{ github.event.inputs.policy_id }}
          path: artifacts/manual-analysis/disposition-*.json
          if-no-files-found: error
          retention-days: 30
