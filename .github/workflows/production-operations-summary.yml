name: Build production operations summary

on:
  schedule:
    # Daily at 00:35 UTC (08:35 Beijing / 09:35 Tokyo).
    - cron: "35 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect read-only production state
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/operations
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Crawl policy sources hourly" \
            --limit 200 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event,headSha,url \
            > artifacts/operations/hourly-runs.json
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Recover missed policy collection" \
            --limit 50 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event,headSha,url \
            > artifacts/operations/recovery-runs.json
          cp artifacts/operations/recovery-runs.json artifacts/operations/recovery-runs-annotated.json
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            job_json=""
            for attempt in 1 2 3; do
              if job_json=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs 2>/dev/null); then
                break
              fi
              sleep $((attempt * 2))
            done
            if [ -z "$job_json" ]; then
              echo "::warning::Unable to inspect recovery run $run_id; freshness will use the remaining annotated runs."
              continue
            fi
            recovery_performed=$(jq 'any(.jobs[].steps[]?; .name == "Run recovery crawl" and .conclusion == "success")' <<< "$job_json")
            jq --argjson id "$run_id" --argjson performed "$recovery_performed" \
              'map(if .databaseId == $id then . + {recoveryPerformed: $performed} else . end)' \
              artifacts/operations/recovery-runs-annotated.json \
              > artifacts/operations/recovery-runs-annotated.tmp.json
            mv artifacts/operations/recovery-runs-annotated.tmp.json artifacts/operations/recovery-runs-annotated.json
          done < <(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0:10][].databaseId' artifacts/operations/recovery-runs.json)
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Remote policy collection liveness" \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt,updatedAt,event,headSha,url \
            > artifacts/operations/liveness-runs.json
          node scripts/manual-policy-analysis.mjs list --limit=100 --since=2026-07-15 \
            > artifacts/operations/current-inbox.json
          node scripts/manual-policy-analysis.mjs list --limit=100 --since=2026-05-01 \
            > artifacts/operations/historical-inbox.json

      - name: Build summary and historical migration plan
        run: |
          node scripts/build-production-operations-summary.mjs
          node scripts/plan-manual-inbox-migration.mjs \
            --input=artifacts/operations/historical-inbox.json \
            --out-json=artifacts/operations/historical-inbox-migration-plan.json \
            --out-markdown=artifacts/operations/historical-inbox-migration-plan.md

      - name: Upload operations summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-operations-summary-${{ github.run_id }}
          path: artifacts/operations/
          if-no-files-found: error
          retention-days: 14
