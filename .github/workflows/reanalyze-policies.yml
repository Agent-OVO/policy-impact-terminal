name: Reanalyze published policies

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum published policies to refresh"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: policy-reanalysis
  cancel-in-progress: false

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh published report payloads
        env:
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
          REANALYZE_LIMIT: ${{ github.event.inputs.limit || '30' }}
        run: node scripts/reanalyze-published-policies.mjs --limit="${REANALYZE_LIMIT}"
