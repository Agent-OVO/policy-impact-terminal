name: List pending manual policy analysis

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum pending policies to list"
        required: false
        default: "20"
      since:
        description: "Only include policies published on or after this date"
        required: false
        default: "2026-05-01"

permissions:
  contents: read

concurrency:
  group: policy-manual-analysis-list
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: List pending manual analysis policies
        env:
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
          MANUAL_ANALYSIS_LIMIT: ${{ github.event.inputs.limit || '20' }}
          MANUAL_ANALYSIS_SINCE: ${{ github.event.inputs.since || '2026-05-01' }}
        run: |
          mkdir -p artifacts/manual-analysis
          node scripts/manual-policy-analysis.mjs list \
            --limit="${MANUAL_ANALYSIS_LIMIT}" \
            --since="${MANUAL_ANALYSIS_SINCE}" \
            | tee artifacts/manual-analysis/pending-manual-analysis.json

      - name: Upload pending manual analysis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pending-manual-analysis
          path: artifacts/manual-analysis/pending-manual-analysis.json
          if-no-files-found: error
