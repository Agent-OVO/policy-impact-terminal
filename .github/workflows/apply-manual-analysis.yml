name: Apply manual policy analysis

on:
  workflow_dispatch:
    inputs:
      policy_id:
        description: "Policy UUID to publish with manual analysis"
        required: true
      report_file:
        description: "Repository path to reportPayload JSON"
        required: true

permissions:
  contents: read

concurrency:
  group: apply-manual-policy-analysis-${{ github.event.inputs.policy_id }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate report file path
        env:
          REPORT_FILE: ${{ github.event.inputs.report_file }}
        run: |
          case "$REPORT_FILE" in
            manual-reports/*.json) ;;
            *)
              echo "::error::report_file must be a JSON file under manual-reports/"
              exit 1
              ;;
          esac
          test -f "$REPORT_FILE"

      - name: Validate manual report payload
        env:
          REPORT_FILE: ${{ github.event.inputs.report_file }}
          MANUAL_QUALITY_STRICT: "true"
        run: npm run manual:validate -- "$REPORT_FILE"

      - name: Run validation regression suite
        run: npm run manual:test

      - name: Check governance registry and metrics
        run: npm run manual:metrics

      - name: Validate revision and projection core
        run: npm run stage7:test

      - name: Execute revision lifecycle migrations in temporary PostgreSQL WASM
        run: npm run stage7:migration-test

      - name: Check invite-only authentication boundary
        run: npm run auth:test

      - name: Check workflow contracts
        run: npm run workflow:test

      - name: Check generated workflow consistency
        run: npm run workflow:generated-check

      - name: Check production mutation guards
        run: npm run production:guard:test

      - name: Check zero-cost backup guards
        run: npm run backup:guard:test

      - name: Check zero-cost backup cryptography
        run: npm run backup:crypto:test

      - name: Check production source export guards
        run: npm run production:source-guard:test

      - name: Type-check Edge Functions
        run: npm run edge:typecheck

      - name: Test Edge Function shared boundaries
        run: npm run edge:test

      - name: Apply manual analysis
        env:
          SUPABASE_URL: https://qxzspsofhmfjceuaulhu.supabase.co
          SUPABASE_FUNCTION_JWT: ${{ secrets.SUPABASE_FUNCTION_JWT }}
          SUPABASE_CRAWLER_SECRET: ${{ secrets.SUPABASE_CRAWLER_SECRET }}
          POLICY_ID: ${{ github.event.inputs.policy_id }}
          REPORT_FILE: ${{ github.event.inputs.report_file }}
        run: npm run manual:policies -- apply --policyId="${POLICY_ID}" --file="${REPORT_FILE}"
